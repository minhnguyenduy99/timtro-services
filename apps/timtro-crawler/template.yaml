AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Timtro crawler service for Apify ingestion and AI sanitization.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ApifyActorId:
    Type: String
  FacebookGroupUrls:
    Type: CommaDelimitedList
  ApifyToken:
    Type: String
    NoEcho: true
  GeminiApiKey:
    Type: String
    NoEcho: true
  GeminiModel:
    Type: String
    Default: gemini-2.5-flash
  TimtroUseFakeProviders:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 60
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT_NAME: !Ref EnvironmentName
        RAW_RENTAL_POSTS_TABLE_NAME: !Ref RawRentalPostsTable
        RENTAL_INFO_TABLE_NAME: !Ref RentalInfoTableV2
        SANITIZATION_QUEUE_URL: !Ref SanitizationQueue
        APIFY_ACTOR_ID: !Ref ApifyActorId
        FACEBOOK_GROUP_URLS: !Join [",", !Ref FacebookGroupUrls]
        APIFY_TOKEN: !Ref ApifyToken
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel
        TIMTRO_USE_FAKE_PROVIDERS: !Ref TimtroUseFakeProviders
        LOG_LEVEL: info

Resources:
  RawRentalPostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timtro-raw-rental-posts-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  RentalInfoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timtro-rental-info-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: region
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: region
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  RentalInfoTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timtro-rental-info-v2-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: region
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: postDate
          AttributeType: S
        - AttributeName: price
          AttributeType: N
      KeySchema:
        - AttributeName: region
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: byPostDate
          KeySchema:
            - AttributeName: region
              KeyType: HASH
            - AttributeName: postDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byPrice
          KeySchema:
            - AttributeName: region
              KeyType: HASH
            - AttributeName: price
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SanitizationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "timtro-sanitization-dlq-${EnvironmentName}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SanitizationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "timtro-sanitization-${EnvironmentName}"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SanitizationDeadLetterQueue.Arn
        maxReceiveCount: 5

  AttachmentMediaBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - UpdateAttachmentMetadataFunctionAttachmentMediaPermission
    Properties:
      BucketName: !Sub "timtro-attachment-media-${EnvironmentName}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: public/attachments/
            Function: !GetAtt UpdateAttachmentMetadataFunction.Arn
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  AttachmentMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AttachmentMediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadMirroredAttachments
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${AttachmentMediaBucket.Arn}/public/*"

  DownloadAttachmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "timtro-download-attachment-${EnvironmentName}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  CrawlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      Handler: crawl.handler
      CodeUri: dist/
      Description: Runs the scheduled Apify crawl and queues changed raw posts.
      Timeout: 900
      Events:
        CrawlSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 0 * * ? *)
            ScheduleExpressionTimezone: Asia/Ho_Chi_Minh
            Description: Run Timtro crawler daily at midnight ICT (UTC+7).
            FlexibleTimeWindow:
              Mode: "OFF"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RawRentalPostsTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt SanitizationQueue.Arn

  SanitizeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      Handler: sanitize.handler
      CodeUri: dist/
      Description: Sanitizes queued raw rental posts with the configured AI provider.
      Timeout: 120
      Environment:
        Variables:
          DOWNLOAD_ATTACHMENT_QUEUE_URL: !Ref DownloadAttachmentQueue
      Events:
        SanitizationEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt SanitizationQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RawRentalPostsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt RentalInfoTableV2.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt DownloadAttachmentQueue.Arn

  DownloadAttachmentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      Handler: download-attachment.handler
      CodeUri: dist/
      Description: Downloads Facebook attachments and mirrors them to S3.
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DOWNLOAD_ATTACHMENT_QUEUE_URL: !Ref DownloadAttachmentQueue
          ATTACHMENT_MEDIA_BUCKET_NAME: !Sub "timtro-attachment-media-${EnvironmentName}"
      Events:
        DownloadAttachmentEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt DownloadAttachmentQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt RentalInfoTableV2.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::timtro-attachment-media-${EnvironmentName}/public/*"

  UpdateAttachmentMetadataFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      Handler: update-attachment-metadata.handler
      CodeUri: dist/
      Description: Updates rental info attachment URLs when mirrored media objects are uploaded.
      Timeout: 60
      Environment:
        Variables:
          ATTACHMENT_MEDIA_BUCKET_NAME: !Sub "timtro-attachment-media-${EnvironmentName}"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt RentalInfoTableV2.Arn

  UpdateAttachmentMetadataFunctionAttachmentMediaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateAttachmentMetadataFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::timtro-attachment-media-${EnvironmentName}"
