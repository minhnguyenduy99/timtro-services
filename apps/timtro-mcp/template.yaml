AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Timtro MCP Lambda service behind HTTP API.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  RentalInfoTableName:
    Type: String
    Default: ""
    Description: Override table name; defaults to timtro-rental-info-v2-{EnvironmentName}.
  McpApiKey:
    Type: String
    NoEcho: true
    Description: Bearer token for MCP HTTP auth.
  Auth0Domain:
    Type: String
    Default: ""
    Description: Auth0 tenant domain, e.g. your-tenant.auth0.com.
  McpServerUrl:
    Type: String
    Default: ""
    Description: Canonical MCP resource URI, typically the stack McpApiUrl output.
  Auth0Audience:
    Type: String
    Default: ""
    Description: Auth0 API identifier; usually the same as McpServerUrl.

Conditions:
  HasCustomTableName: !Not [!Equals [!Ref RentalInfoTableName, ""]]

Resources:
  McpHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - Mcp-Session-Id
          - MCP-Protocol-Version
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      Handler: lambda.handler
      CodeUri: dist/
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          RENTAL_INFO_TABLE_NAME: !If
            - HasCustomTableName
            - !Ref RentalInfoTableName
            - !Sub "timtro-rental-info-v2-${EnvironmentName}"
          MCP_API_KEY: !Ref McpApiKey
          AUTH0_DOMAIN: !Ref Auth0Domain
          AUTH0_AUDIENCE: !Ref Auth0Audience
          MCP_SERVER_URL: !Ref McpServerUrl
          NODE_ENV: production
      Events:
        McpGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpHttpApi
            Path: /mcp
            Method: GET
            PayloadFormatVersion: "2.0"
        McpPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpHttpApi
            Path: /mcp
            Method: POST
            PayloadFormatVersion: "2.0"
        McpDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpHttpApi
            Path: /mcp
            Method: DELETE
            PayloadFormatVersion: "2.0"
        ProtectedResourceMetadataMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpHttpApi
            Path: /.well-known/oauth-protected-resource/mcp
            Method: GET
            PayloadFormatVersion: "2.0"
        ProtectedResourceMetadataRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpHttpApi
            Path: /.well-known/oauth-protected-resource
            Method: GET
            PayloadFormatVersion: "2.0"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !If
              - HasCustomTableName
              - !Ref RentalInfoTableName
              - !Sub "timtro-rental-info-v2-${EnvironmentName}"

  McpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${McpFunction}"
      RetentionInDays: 30

Outputs:
  McpApiUrl:
    Description: MCP HTTP API endpoint URL.
    Value: !Sub "https://${McpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"
  McpFunctionArn:
    Description: MCP Lambda function ARN.
    Value: !GetAtt McpFunction.Arn
  RentalInfoTableName:
    Description: DynamoDB table name resolved for this stack.
    Value: !If
      - HasCustomTableName
      - !Ref RentalInfoTableName
      - !Sub "timtro-rental-info-v2-${EnvironmentName}"
